<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DiagramForge — Visual Diagram Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>DiagramForge</h1>
      <p class="app-subtitle">Visual Diagram Builder</p>
    </div>
    <p id="app-status" class="app-status" role="status" aria-live="polite">Loading diagram...</p>
  </header>

  <main class="workspace">
    <section class="canvas-panel" aria-label="Diagram canvas">
      <div class="toolbar" aria-label="Diagram editor tools">
        <button type="button" id="add-startEnd" class="tool-button">Add Start/End</button>
        <button type="button" id="add-process" class="tool-button">Add Process</button>
        <button type="button" id="add-decision" class="tool-button">Add Decision</button>
        <button type="button" id="add-inputOutput" class="tool-button">Add Input/Output</button>
        <button type="button" id="connect-mode" class="tool-button" aria-pressed="false">Connector mode</button>
        <button type="button" id="delete-selection" class="tool-button">Delete</button>
        <button type="button" id="new-diagram" class="tool-button">New diagram</button>
        <button type="button" id="import-json" class="tool-button">Import JSON</button>
        <button type="button" id="export-json" class="tool-button">Export JSON</button>
        <button type="button" id="export-svg" class="tool-button">Export SVG</button>
        <button type="button" id="export-png" class="tool-button">Export PNG</button>
        <button type="button" id="undo" class="tool-button">Undo</button>
        <button type="button" id="redo" class="tool-button">Redo</button>
        <button type="button" id="zoom-in" class="tool-button">Zoom +</button>
        <button type="button" id="zoom-out" class="tool-button">Zoom -</button>
        <button type="button" id="fit-view" class="tool-button">Fit</button>
        <button type="button" id="reset-zoom" class="tool-button">Reset Zoom</button>
        <button type="button" id="pan-mode" class="tool-button" aria-pressed="false">Pan</button>
      </div>
      <svg id="diagram-canvas" class="diagram-canvas" tabindex="-1" viewBox="0 0 1600 900" role="img" aria-label="DiagramForge diagram canvas"></svg>
      <div id="empty-state" class="empty-state" role="status">
        <h2>Diagram is empty</h2>
        <p>Use the toolbar to add nodes, then connect them with connector mode.</p>
      </div>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </section>

    <aside class="inspector" id="inspector" aria-label="Diagram properties">
      <h2>Diagram</h2>
      <p id="diagram-info">0 nodes, 0 edges</p>
      <p class="inspector-note">Select a node or edge to edit its properties.</p>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
